<title id="t">Incident Response Scripts</title>
<desc id="d">A terminal panel showing the login monitoring script flagging a possible brute force and the asset inventory script writing its JSON output. Stylised, not real output.</desc>
<style>.p{animation:p 3s ease-in-out infinite}@keyframes p{50%{opacity:.35}}@media (prefers-reduced-motion: reduce){*{animation:none!important;}}</style>
<defs><clipPath id="c"><rect width="1280" height="260" rx="24"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="1280" height="260" fill="#06130E"/><g transform="translate(780 40)" style="font-family:'JetBrains Mono','Cascadia Code','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:13px"><rect width="430" height="180" rx="10" fill="#03100A" stroke="#34D399" stroke-opacity=".5"/>
      <text x="16" y="30" fill="#34D399">$ python3 SuspiciousLoginMonitoring.py</text>
      <text x="16" y="58" fill="#A7F3D0">[*] watching auth log…</text>
      <text x="16" y="82" fill="#FCA5A5" class="p">[!] 5 failed logins · same source</text>
      <text x="16" y="106" fill="#FCA5A5">[!] possible brute force detected</text>
      <text x="16" y="134" fill="#34D399">$ python3 "Asset Inventory Script.py"</text>
      <text x="16" y="158" fill="#A7F3D0">[+] AssetInventoryOutput.json written</text></g></g>
